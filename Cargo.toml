[workspace]
members = [
    "programs/flint-escrow",
    "programs/flint-market",
    "programs/flint-reputation",
]
resolver = "2"

[workspace.package]
rust-version = "1.75"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
