[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.20"

[features]
resolution = true
skip-lint = false

[programs.localnet]
flint_escrow = "FLiNTEscrow111111111111111111111111111111111"
flint_market = "FLiNTMarket111111111111111111111111111111111"
flint_reputation = "FLiNTSBT111111111111111111111111111111111111"

[programs.devnet]
flint_escrow = "FLiNTEscrow111111111111111111111111111111111"
flint_market = "FLiNTMarket111111111111111111111111111111111"
flint_reputation = "FLiNTSBT111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
quant = "python sdk-python/flint_quant/examples/velocity_arb.py"

[magicblock]
ephemeral_rpc = "https://devnet.magicblock.app"
ephemeral_ws = "wss://devnet.magicblock.app"
router = "https://router.magicblock.app"
intel_tdx_tee = true
